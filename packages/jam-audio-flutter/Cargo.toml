[package]
name = "jam_audio_flutter"
version = "0.5.0"
edition = "2024"
description = "Flutter/Dart bridge for audio metadata and artwork extraction from the Jam Audio engine (web target only; no playback)"
repository = "https://github.com/jamart3d/jam-audio"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
jam_audio_engine = { path = "../jam-audio-engine", package = "jam-audio-engine" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }
