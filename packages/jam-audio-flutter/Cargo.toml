[package]
name = "jam_audio_flutter"
version = "0.2.12"
edition = "2024"
description = "Flutter bridge for the Jamdisc Rust audio engine"
repository = "https://github.com/jamart3d/jam-audio"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
jam_audio_engine = { path = "../jam-audio-engine", package = "jam-audio-engine" }

[profile.release]
opt-level = "s"
lto = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[patch.crates-io]
opus-rs = { path = "../../third_party/opus-rs" }
