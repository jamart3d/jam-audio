[package]
name = "jam-audio-engine"
version = "0.3.7"
edition = "2024"
rust-version = "1.89"
description = "Rust audio engine for decoding, metadata extraction, ring buffering, and gapless playback"
repository = "https://github.com/jamart3d/jam-audio"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
js-sys = "0.3"
rubato = { version = "0.15", default-features = false }
symphonia = { version = "0.5", features = ["mp3", "ogg", "flac"] }
symphonia-core = "0.5"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
symphonia-adapter-libopus = "0.2.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
unopus = "0.0.1"
opus-rs = "0.1.16"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
unopus = "0.0.1"
opus-rs = "0.1.16"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
